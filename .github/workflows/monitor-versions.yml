name: Monitor and Sync Home Assistant Versions

on:
  push:
    branches: ["master"]
    paths:
      - 'stable.json'
  workflow_dispatch:
    inputs:
      sync_mode:
        description: '同步模式：incremental=增量比对, full=全量重推, custom=自定义单镜像'
        type: choice
        options:
          - incremental
          - full
          - custom
        default: incremental
      custom_target:
        description: '自定义同步目标（仅 custom 模式）'
        type: choice
        options:
          - homeassistant
          - cli
          - dns
          - audio
          - multicast
          - observer
          - supervisor
        default: cli
      custom_version:
        description: '版本号（仅 custom 模式，如 2026.06.0）'
        type: string
        default: ''
      # Machine list should match stable.json's homeassistant object keys.
      # If a new machine is added to stable.json, add it here too.
      custom_machine:
        description: 'HA machine 名（仅 custom_target=homeassistant 时生效）'
        type: choice
        options:
          - default
          - generic-x86-64
          - intel-nuc
          - raspberrypi
          - raspberrypi2
          - raspberrypi3
          - raspberrypi3-64
          - raspberrypi4
          - raspberrypi4-64
          - raspberrypi5-64
          - yellow
          - green
          - khadas-vim3
          - tinker
          - odroid-c2
          - odroid-c4
          - odroid-m1
          - odroid-n2
          - odroid-xu
          - qemux86
          - qemux86-64
          - qemuarm
          - qemuarm-64
        default: default
      full_sync_scope:
        description: '全量同步范围（仅 sync_mode=full 时生效）'
        type: choice
        options:
          - all
          - homeassistant
          - components
          - supervisor
        default: all

env:
  CN_REGISTRY: ${{ secrets.CN_REGISTRY }}
  CN_NAMESPACE: ${{ secrets.CN_REGISTRY_SPACE }}

permissions:
  contents: read

concurrency:
  group: monitor-versions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ github.event_name == 'push' || inputs.sync_mode != 'custom' }}
    runs-on: ubuntu-latest
    outputs:
      changed_machines: ${{ steps.compare.outputs.changed_machines }}
      homeassistant_changed: ${{ steps.compare.outputs.homeassistant_changed }}
      component_names: ${{ steps.compare.outputs.component_names }}
      components_changed: ${{ steps.compare.outputs.components_changed }}
      supervisor_changed: ${{ steps.compare.outputs.supervisor_changed }}
      new_supervisor_version: ${{ steps.compare.outputs.new_supervisor_version }}
      full_sync: ${{ steps.compare.outputs.full_sync }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2

    - name: Compare versions
      id: compare
      env:
        FORCE_FULL: ${{ inputs.sync_mode == 'full' }}
        SCOPE: ${{ inputs.full_sync_scope || 'all' }}
      run: |
        set -euo pipefail

        CURRENT=$(cat stable.json)
        if [ "$FORCE_FULL" = "true" ]; then
          # Treat all current versions as changed by comparing against an empty
          # baseline. Downstream pull failures are tolerated (skip) in this mode,
          # since some images may legitimately not exist (e.g. 32-bit machines
          # pinned at old versions that upstream no longer publishes).
          PREVIOUS='{}'
          echo "::notice::Force full sync requested, treating all versions as changed"
        else
          PREVIOUS=$(git show HEAD^:stable.json 2>/dev/null || echo '{}')
        fi

        # Per-machine Home Assistant version comparison.
        # stable.json pins specific versions per machine (e.g. qemux86 may lag
        # behind default); only machines whose value actually changed need syncing.
        CHANGED_MACHINES=$(jq -nc '
          ($cur.homeassistant // {}) as $c
          | ($prev.homeassistant // {}) as $p
          | $c | to_entries
          | map(select(
              (.value | type) == "string"
              and .value != ""
              and .value != ($p[.key] // null)
            )
            | {machine: .key, version: .value}
          )
        ' --argjson cur "$CURRENT" --argjson prev "$PREVIOUS")

        HA_CHANGED=false
        if [ "$(printf '%s' "$CHANGED_MACHINES" | jq 'length')" -gt 0 ]; then
          HA_CHANGED=true
        fi

        # HassIO component comparison (top-level fields: cli, dns, audio,
        # multicast, observer). Each has a single version across all arches.
        COMPONENT_NAMES=$(jq -nc '
          ["cli","dns","audio","multicast","observer"] as $keys
          | $keys
          | map(select(
              ($cur[.] // null) != ($prev[.] // null)
              and ($cur[.] | type) == "string"
            ))
        ' --argjson cur "$CURRENT" --argjson prev "$PREVIOUS")

        COMPONENTS_CHANGED=false
        if [ "$(printf '%s' "$COMPONENT_NAMES" | jq 'length')" -gt 0 ]; then
          COMPONENTS_CHANGED=true
        fi

        # Supervisor version comparison (top-level field).
        # supervisor is self-built in the supervisor repo and pushed to
        # ghcr.io/home-assistant-cn/<arch>-hassio-supervisor. builder.yml's
        # version job updates this field AFTER the image is published, so when
        # this workflow triggers the upstream image is already available.
        CURRENT_SUPERVISOR=$(jq -r '.supervisor // empty' <<< "$CURRENT")
        PREVIOUS_SUPERVISOR=$(jq -r '.supervisor // empty' <<< "$PREVIOUS")
        SUPERVISOR_CHANGED=false
        NEW_SUPERVISOR=""
        if [ -n "$CURRENT_SUPERVISOR" ] && [ "$CURRENT_SUPERVISOR" != "$PREVIOUS_SUPERVISOR" ]; then
          SUPERVISOR_CHANGED=true
          NEW_SUPERVISOR="$CURRENT_SUPERVISOR"
        fi

        # Apply full_sync_scope filter: in full mode, allow syncing only a subset.
        if [ "$FORCE_FULL" = "true" ] && [ "$SCOPE" != "all" ]; then
          if [ "$SCOPE" != "homeassistant" ]; then
            CHANGED_MACHINES='[]'
            HA_CHANGED=false
            echo "::notice::Full sync scope='${SCOPE}': skipping homeassistant"
          fi
          if [ "$SCOPE" != "components" ]; then
            COMPONENT_NAMES='[]'
            COMPONENTS_CHANGED=false
            echo "::notice::Full sync scope='${SCOPE}': skipping components"
          fi
          if [ "$SCOPE" != "supervisor" ]; then
            SUPERVISOR_CHANGED=false
            NEW_SUPERVISOR=""
            echo "::notice::Full sync scope='${SCOPE}': skipping supervisor"
          fi
        fi

        {
          echo "changed_machines=${CHANGED_MACHINES}"
          echo "homeassistant_changed=${HA_CHANGED}"
          echo "component_names=${COMPONENT_NAMES}"
          echo "components_changed=${COMPONENTS_CHANGED}"
          echo "supervisor_changed=${SUPERVISOR_CHANGED}"
          echo "new_supervisor_version=${NEW_SUPERVISOR}"
          echo "full_sync=${FORCE_FULL}"
        } >> "$GITHUB_OUTPUT"

        echo "::notice::Changed machines: ${CHANGED_MACHINES}"
        echo "::notice::Changed components: ${COMPONENT_NAMES}"
        if [ "$SUPERVISOR_CHANGED" = "true" ]; then
          echo "::notice::Changed supervisor: ${NEW_SUPERVISOR}"
        fi

  sync_homeassistant:
    needs: monitor
    if: ${{ needs.monitor.outputs.homeassistant_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.monitor.outputs.changed_machines) }}
    steps:
      - name: Login to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CN_REGISTRY }}
          username: ${{ secrets.CN_REGISTRY_USERNAME }}
          password: ${{ secrets.CN_REGISTRY_PASSWORD }}

      - name: Process Home Assistant image
        env:
          MACHINE: ${{ matrix.machine }}
          VERSION: ${{ matrix.version }}
          FULL_SYNC: ${{ needs.monitor.outputs.full_sync }}
        run: |
          set -euo pipefail

          machine="$MACHINE"
          version="$VERSION"

          if [ "$machine" = "default" ]; then
            image_name="home-assistant"
          else
            image_name="${machine}-homeassistant"
          fi

          SRC_IMAGE="ghcr.io/home-assistant/${image_name}"
          DEST_IMAGE="${CN_REGISTRY}/${CN_NAMESPACE}/${image_name}"

          echo "Processing ${image_name} version ${version}"

          # Pull with retry to tolerate transient registry errors.
          pull_ok=false
          for i in 1 2 3; do
            if docker pull "${SRC_IMAGE}:${version}"; then
              pull_ok=true
              break
            fi
            echo "::warning::Pull attempt ${i} failed for ${SRC_IMAGE}:${version}, retrying in 5s"
            sleep 5
          done

          if [ "$pull_ok" != "true" ]; then
            if [ "$FULL_SYNC" = "true" ]; then
              echo "::warning::Image not found, skipping (full sync mode): ${SRC_IMAGE}:${version}"
              exit 0
            else
              echo "::error::Image not found after retries: ${SRC_IMAGE}:${version}"
              exit 1
            fi
          fi

          docker tag "${SRC_IMAGE}:${version}" "${DEST_IMAGE}:${version}"
          docker tag "${SRC_IMAGE}:${version}" "${DEST_IMAGE}:stable"

          # The generic image additionally carries latest + beta/rc channel
          # tags and a YYYY.M tag. stable.json is the stable channel, so
          # beta/rc tags here point at the stable build (CN mirror fallback).
          if [ "$machine" = "default" ]; then
            ym_tag=$(echo "${version}" | awk -F. '{print $1"."$2}')
            docker tag "${SRC_IMAGE}:${version}" "${DEST_IMAGE}:latest"
            docker tag "${SRC_IMAGE}:${version}" "${DEST_IMAGE}:beta"
            docker tag "${SRC_IMAGE}:${version}" "${DEST_IMAGE}:rc"
            docker tag "${SRC_IMAGE}:${version}" "${DEST_IMAGE}:${ym_tag}"
          fi

          for tag in "${version}" stable; do
            if ! docker push "${DEST_IMAGE}:${tag}"; then
              echo "::error::Failed to push ${DEST_IMAGE}:${tag}"
              exit 1
            fi
          done

          if [ "$machine" = "default" ]; then
            for tag in latest beta rc "${ym_tag}"; do
              if ! docker push "${DEST_IMAGE}:${tag}"; then
                echo "::error::Failed to push ${DEST_IMAGE}:${tag}"
                exit 1
              fi
            done
          fi

          docker rmi "${SRC_IMAGE}:${version}" 2>/dev/null || true
          echo "::notice::Successfully synced ${image_name}:${version}"

  sync_hassio_components:
    needs: monitor
    if: ${{ needs.monitor.outputs.components_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        arch: ['amd64', 'aarch64']
        component: ${{ fromJSON(needs.monitor.outputs.component_names) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CN_REGISTRY }}
          username: ${{ secrets.CN_REGISTRY_USERNAME }}
          password: ${{ secrets.CN_REGISTRY_PASSWORD }}

      - name: Get component version
        id: get_version
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          component="$COMPONENT"
          version=$(jq -r --arg c "$component" '.[$c]' stable.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Version not found for component ${component}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Process HassIO component
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.get_version.outputs.version }}
          FULL_SYNC: ${{ needs.monitor.outputs.full_sync }}
        run: |
          set -euo pipefail

          component="$COMPONENT"
          version="$VERSION"
          SRC_IMAGE="ghcr.io/home-assistant/${ARCH}-hassio-${component}"
          DEST_IMAGE="${CN_REGISTRY}/${CN_NAMESPACE}/${ARCH}-hassio-${component}"

          echo "Processing ${component} version ${version} for ${ARCH}"

          pull_ok=false
          for i in 1 2 3; do
            if docker pull "${SRC_IMAGE}:${version}"; then
              pull_ok=true
              break
            fi
            echo "::warning::Pull attempt ${i} failed for ${SRC_IMAGE}:${version}, retrying in 5s"
            sleep 5
          done

          if [ "$pull_ok" != "true" ]; then
            if [ "$FULL_SYNC" = "true" ]; then
              echo "::warning::Image not found, skipping (full sync mode): ${SRC_IMAGE}:${version}"
              exit 0
            else
              echo "::error::Image not found after retries: ${SRC_IMAGE}:${version}"
              exit 1
            fi
          fi

          docker tag "${SRC_IMAGE}:${version}" "${DEST_IMAGE}:${version}"
          docker tag "${SRC_IMAGE}:${version}" "${DEST_IMAGE}:latest"

          for tag in "${version}" latest; do
            if ! docker push "${DEST_IMAGE}:${tag}"; then
              echo "::error::Failed to push ${DEST_IMAGE}:${tag}"
              exit 1
            fi
          done

          docker rmi "${SRC_IMAGE}:${version}" 2>/dev/null || true
          echo "::notice::Successfully synced ${component}:${version} for ${ARCH}"

  sync_supervisor:
    needs: monitor
    if: ${{ needs.monitor.outputs.supervisor_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        arch: ['amd64', 'aarch64']
    steps:
      - name: Login to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CN_REGISTRY }}
          username: ${{ secrets.CN_REGISTRY_USERNAME }}
          password: ${{ secrets.CN_REGISTRY_PASSWORD }}

      - name: Process Supervisor image
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.monitor.outputs.new_supervisor_version }}
          FULL_SYNC: ${{ needs.monitor.outputs.full_sync }}
        run: |
          set -euo pipefail

          version="$VERSION"
          # supervisor is self-built and published to the home-assistant-cn
          # ghcr namespace (not the official home-assistant namespace). The
          # package is public, so no ghcr login is required to pull.
          SRC_IMAGE="ghcr.io/home-assistant-cn/${ARCH}-hassio-supervisor"
          DEST_IMAGE="${CN_REGISTRY}/${CN_NAMESPACE}/${ARCH}-hassio-supervisor"

          echo "Processing supervisor ${ARCH} version ${version}"

          pull_ok=false
          for i in 1 2 3; do
            if docker pull "${SRC_IMAGE}:${version}"; then
              pull_ok=true
              break
            fi
            echo "::warning::Pull attempt ${i} failed for ${SRC_IMAGE}:${version}, retrying in 5s"
            sleep 5
          done

          if [ "$pull_ok" != "true" ]; then
            if [ "$FULL_SYNC" = "true" ]; then
              echo "::warning::Image not found, skipping (full sync mode): ${SRC_IMAGE}:${version}"
              exit 0
            else
              echo "::error::Image not found after retries: ${SRC_IMAGE}:${version}"
              exit 1
            fi
          fi

          docker tag "${SRC_IMAGE}:${version}" "${DEST_IMAGE}:${version}"
          docker tag "${SRC_IMAGE}:${version}" "${DEST_IMAGE}:latest"

          for tag in "${version}" latest; do
            if ! docker push "${DEST_IMAGE}:${tag}"; then
              echo "::error::Failed to push ${DEST_IMAGE}:${tag}"
              exit 1
            fi
          done

          docker rmi "${SRC_IMAGE}:${version}" 2>/dev/null || true
          echo "::notice::Successfully synced supervisor:${version} for ${ARCH}"

  sync_custom:
    if: ${{ inputs.sync_mode == 'custom' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Login to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CN_REGISTRY }}
          username: ${{ secrets.CN_REGISTRY_USERNAME }}
          password: ${{ secrets.CN_REGISTRY_PASSWORD }}

      - name: Sync custom image
        env:
          TARGET: ${{ inputs.custom_target }}
          VERSION: ${{ inputs.custom_version }}
          MACHINE: ${{ inputs.custom_machine }}
        run: |
          set -euo pipefail

          target="$TARGET"
          version="$VERSION"
          machine="$MACHINE"

          if [ -z "$version" ]; then
            echo "::error::custom_version is required for custom sync mode"
            exit 1
          fi

          # custom_machine only applies to homeassistant target. Warn if the
          # user changed it for a non-homeassistant target (GitHub Actions UI
          # cannot conditionally disable inputs, so we notify at runtime).
          if [ "$target" != "homeassistant" ] && [ "$machine" != "default" ]; then
            echo "::notice::custom_machine='${machine}' is ignored when custom_target='${target}' (only applies to homeassistant)"
          fi

          # Sync a single image: pull with retry, tag all labels, push all.
          # Tag strategy mirrors the automatic sync jobs:
          #   homeassistant default  -> version + stable + latest + beta + rc + YYYY.M
          #   homeassistant <other>  -> version + stable
          #   component / supervisor -> version + latest
          sync_one() {
            local src="$1" dest="$2" ver="$3"
            shift 3
            local tags=("$@")

            echo "::notice::Syncing ${src}:${ver} -> ${dest}"

            pull_ok=false
            for i in 1 2 3; do
              if docker pull "${src}:${ver}"; then
                pull_ok=true
                break
              fi
              echo "::warning::Pull attempt ${i} failed for ${src}:${ver}, retrying in 5s"
              sleep 5
            done

            if [ "$pull_ok" != "true" ]; then
              echo "::error::Image not found after retries: ${src}:${ver}"
              exit 1
            fi

            for tag in "${tags[@]}"; do
              docker tag "${src}:${ver}" "${dest}:${tag}"
              if ! docker push "${dest}:${tag}"; then
                echo "::error::Failed to push ${dest}:${tag}"
                exit 1
              fi
            done

            docker rmi "${src}:${ver}" 2>/dev/null || true
            echo "::notice::Successfully synced ${dest}:${ver}"
          }

          case "$target" in
            homeassistant)
              if [ "$machine" = "default" ]; then
                image_name="home-assistant"
              else
                image_name="${machine}-homeassistant"
              fi
              src="ghcr.io/home-assistant/${image_name}"
              dest="${CN_REGISTRY}/${CN_NAMESPACE}/${image_name}"
              tags=("${version}" "stable")
              if [ "$machine" = "default" ]; then
                ym_tag=$(echo "${version}" | awk -F. '{print $1"."$2}')
                tags+=("latest" "beta" "rc" "${ym_tag}")
              fi
              sync_one "$src" "$dest" "$version" "${tags[@]}"
              ;;
            cli|dns|audio|multicast|observer)
              for arch in amd64 aarch64; do
                src="ghcr.io/home-assistant/${arch}-hassio-${target}"
                dest="${CN_REGISTRY}/${CN_NAMESPACE}/${arch}-hassio-${target}"
                sync_one "$src" "$dest" "$version" "${version}" "latest"
              done
              ;;
            supervisor)
              for arch in amd64 aarch64; do
                src="ghcr.io/home-assistant-cn/${arch}-hassio-supervisor"
                dest="${CN_REGISTRY}/${CN_NAMESPACE}/${arch}-hassio-supervisor"
                sync_one "$src" "$dest" "$version" "${version}" "latest"
              done
              ;;
            *)
              echo "::error::Unknown custom_target: ${target}"
              exit 1
              ;;
          esac
